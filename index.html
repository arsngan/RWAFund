<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RWAFund — RWA Index Fund on IOPn OPN Chain</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="iopn-logo.svg" alt="IOPn" class="logo" />
      <span>RWAFund</span>
    </div>
    <div class="chain-stats">
      <span>Block <strong id="blockNumber">—</strong></span>
      <span>OPN <strong id="opnBalance">0.0000</strong></span>
      <span>mUSDC <strong id="usdcBalance">0.00</strong></span>
    </div>
    <button id="connectBtn" class="connect-btn">Connect Wallet</button>
    <span id="walletStatus" class="wallet-status">Disconnected</span>
  </header>

  <main class="layout">
    <section class="baskets-panel">
      <h2>Index Baskets</h2>
      <div class="basket-list">
        <button id="basket-TSY-IDX" class="basket-btn selected" data-symbol="TSY-IDX">
          TSY-IDX <span class="basket-name">Treasury Index</span>
        </button>
        <button id="basket-REFI-IDX" class="basket-btn" data-symbol="REFI-IDX">
          REFI-IDX <span class="basket-name">Real Estate Index</span>
        </button>
        <button id="basket-CMDTY-IDX" class="basket-btn" data-symbol="CMDTY-IDX">
          CMDTY-IDX <span class="basket-name">Commodity Index</span>
        </button>
        <button id="basket-EMC-IDX" class="basket-btn" data-symbol="EMC-IDX">
          EMC-IDX <span class="basket-name">Emerging Market Credit Index</span>
        </button>
      </div>

      <div class="holdings">
        <h3>Your Position</h3>
        <p>Shares held: <strong id="shareBalance">0.000000</strong></p>
      </div>
    </section>

    <section class="trade-panel">
      <h2>Buy Index Shares</h2>

      <label for="amountInput">Deposit amount (mUSDC)</label>
      <input id="amountInput" type="number" min="0" step="0.01" placeholder="0.00" />

      <label for="slippageInput">Slippage tolerance (%)</label>
      <input id="slippageInput" type="number" min="0" step="0.1" value="0.5" />

      <div class="breakdown">
        <div class="breakdown-row">
          <span>NAV per share</span>
          <span id="breakdownNav">—</span>
        </div>
        <div class="breakdown-row">
          <span>Estimated shares</span>
          <span id="breakdownShares">0.000000</span>
        </div>
        <div class="breakdown-row">
          <span>Minimum shares (after slippage)</span>
          <span id="breakdownMinShares">0.000000</span>
        </div>
        <div class="breakdown-row warning">
          <span id="breakdownStale"></span>
        </div>
      </div>

      <button id="buyBtn" disabled>Connect wallet to buy</button>

      <hr />

      <h3>Redeem</h3>
      <label for="redeemInput">Shares to redeem</label>
      <input id="redeemInput" type="number" min="0" step="0.000001" placeholder="0.000000" />
      <button id="redeemBtn">Redeem</button>
    </section>
  </main>

  <!-- ethers.js must load before chain.js -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script src="chain.js"></script>
  <script src="app.js"></script>
  <script>
    // Wire the redeem button here since app.js's handleRedeem takes an
    // explicit amount argument rather than reading the DOM itself.
    document.getElementById("redeemBtn")?.addEventListener("click", () => {
      const value = parseFloat(document.getElementById("redeemInput").value);
      handleRedeem(value);
    });

    // Reflect basket selection styling (app.js handles the data fetch;
    // this just toggles the .selected class for visual feedback).
    document.querySelectorAll(".basket-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".basket-btn").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
      });
    });
  </script>
</body>
</html>
